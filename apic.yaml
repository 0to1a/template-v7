version: 1
service: Service
out: internal/gen/api
ts: web/src/lib/gen/api.ts

middlewares:
  auth:
    provides: Principal      # from bearer JWT; id = user's public UUID

crons:
  - check-database:
      every: 10m

types:
  Principal:
    id: str!
  FirebaseConfig:
    api_key: str!
    auth_domain: str!
    project_id: str!
    app_id: str!
  Profile:
    email: str!
    display_name: str!

groups:
  - prefix: /
    use: []
    routes:
      - GET /health:
          name: GetHealth
          resp:
            status: str!

  - prefix: /api/auth          # public: no use: [auth]
    use: []
    routes:
      - POST /request-login:
          name: RequestLogin
          body:
            email: str!      # 204; generic response does not reveal account existence
      - POST /submit-login:
          name: SubmitLogin
          body:
            email: str!
            code: str!
          resp:
            access_token: str!
      - GET /config:
          name: GetAuthConfig
          resp:
            firebase: FirebaseConfig   # absent = Google login disabled
      - POST /google-login:
          name: GoogleLogin
          body:
            id_token: str!   # Firebase ID token from the Google popup
          resp:
            access_token: str!

  - prefix: /api
    use: [auth]
    routes:
      - GET /profile:
          name: GetProfile
          resp: Profile
      - PUT /profile:
          name: UpdateProfile
          body:
            display_name: str   # optional; absent or empty clears the name; trimmed server-side
          resp: Profile
